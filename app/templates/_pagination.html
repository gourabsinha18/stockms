{% if pagination and pagination.pages > 1 %}
{% set base_args = request.args.to_dict() %}
{% set _ = base_args.pop('page', None) %}
<nav aria-label="Page navigation">
    <ul class="pagination pagination-sm">
        <li class="page-item {% if not pagination.has_prev %}disabled{% endif %}">
            <a class="page-link" href="{% if pagination.has_prev %}{{ url_for(request.endpoint, page=pagination.prev_num, **base_args) }}{% else %}#{% endif %}">Previous</a>
        </li>
        {% for p in pagination.iter_pages() %}
            {% if p %}
                <li class="page-item {% if p == pagination.page %}active{% endif %}">
                    <a class="page-link" href="{{ url_for(request.endpoint, page=p, **base_args) }}">{{ p }}</a>
                </li>
            {% else %}
                <li class="page-item disabled"><span class="page-link">&hellip;</span></li>
            {% endif %}
        {% endfor %}
        <li class="page-item {% if not pagination.has_next %}disabled{% endif %}">
            <a class="page-link" href="{% if pagination.has_next %}{{ url_for(request.endpoint, page=pagination.next_num, **base_args) }}{% else %}#{% endif %}">Next</a>
        </li>
    </ul>
</nav>
{% endif %}
