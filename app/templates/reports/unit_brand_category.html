{% extends "base.html" %}
{% block page_title %}Unit / Brand / Category Report{% endblock %}
{% block content %}
<div class="d-flex justify-content-end mb-3">
    <a href="{{ url_for('reports.unit_brand_category', export='csv') }}" class="btn btn-outline-success btn-sm"><i class="bi bi-download"></i> Export CSV</a>
</div>
<div class="card">
    <div class="card-body">
        <table class="table table-hover">
            <thead><tr><th>Unit</th><th>Brand</th><th>Category</th><th class="text-end">Total Quantity</th></tr></thead>
            <tbody>
            {% for unit, brand, category, qty in rows %}
                <tr><td>{{ unit }}</td><td>{{ brand }}</td><td>{{ category }}</td><td class="text-end">{{ qty }}</td></tr>
            {% else %}
                <tr><td colspan="4" class="text-muted text-center py-4">No data.</td></tr>
            {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
