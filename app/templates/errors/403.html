{% extends "base.html" %}
{% block page_title %}Access Denied{% endblock %}
{% block content %}
<div class="text-center py-5">
    <i class="bi bi-shield-lock text-danger" style="font-size:3rem;"></i>
    <h4 class="mt-3">Access Denied</h4>
    <p class="text-muted">You are not authorized to view this resource.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary">Back to Dashboard</a>
</div>
{% endblock %}
{% block guest_content %}
<div class="text-center py-5">
    <h4>Access Denied</h4>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary">Log in</a>
</div>
{% endblock %}
