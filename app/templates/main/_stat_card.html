<div class="col-md-3 col-sm-6 mb-3">
    <div class="card stat-card h-100">
        <div class="card-body">
            <div class="text-muted small">{{ label }}</div>
            <div class="stat-value">{{ value }}</div>
            {% if icon %}<i class="bi {{ icon }} text-primary" style="font-size:1.3rem;"></i>{% endif %}
        </div>
    </div>
</div>
